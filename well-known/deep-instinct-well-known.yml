notes: >-
  portal.deepinstinct.com is the only Deep Instinct host that serves any /.well-known/ discovery
  documents. Both hits are the OAuth discovery pair that fronts the portal's MCP server: RFC 8414
  authorization-server metadata and RFC 9728 protected-resource metadata. The marketing site
  (www.deepinstinct.com, Netlify) returns 404 for every probed path, including security.txt. The DSX
  management REST API is served from each customer's own tenant FQDN and has no anonymously reachable
  host to probe.
