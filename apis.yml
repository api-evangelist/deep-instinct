apis:
- name: Deep Instinct DSX Management REST API
  description: >-
    Versioned REST API exposed by the Deep Instinct DSX management console (D-Appliance) at
    https://<your-tenant-fqdn>/api/v1. Covers devices, device groups, policies, events (including the
    JSON event-search method /api/v1/events/search), hash allow/block lists, remote file deletion and
    process termination, exclusions, licensing and audit logs. Authentication is an API key issued in the
    console and sent on the request. The API and its interactive documentation are served from each
    customer's own tenant host, so neither the docs nor a machine-readable specification are reachable
    anonymously on the public internet.
  humanURL: https://portal.deepinstinct.com/
  baseURL: https://your-tenant.customers.deepinstinctweb.com/api/v1
  tags:
  - cybersecurity
  - endpoint-security
  - threat-prevention
  - soc-automation
  - edr
  properties:
  - type: Authentication
    url: authentication/deep-instinct-authentication.yml
  - type: Conventions
    url: conventions/deep-instinct-conventions.yml
  - type: Lifecycle
    url: lifecycle/deep-instinct-lifecycle.yml
- name: Deep Instinct Portal MCP Server
  description: >-
    Model Context Protocol server hosted on Deep Instinct's customer portal at
    https://portal.deepinstinct.com/mcp, advertised through RFC 9728 protected-resource metadata and an
    RFC 8414 authorization-server document on the same host. Access is OAuth 2.1 (authorization code +
    PKCE S256, refresh tokens, dynamic client registration) scoped by mcp:read and mcp:write. An
    anonymous tools/list call is refused with "MCP is not available for guest users", so the live tool
    schemas require an authenticated portal session.
  humanURL: https://portal.deepinstinct.com/mcp
  baseURL: https://portal.deepinstinct.com/mcp
  tags:
  - mcp
  - agent-native
  - cybersecurity
  properties:
  - type: MCPServer
    url: mcp/deep-instinct-mcp.yml
  - type: MCPServer
    url: https://portal.deepinstinct.com/mcp
  - type: OAuthScopes
    url: scopes/deep-instinct-scopes.yml
  - type: Authentication
    url: authentication/deep-instinct-authentication.yml
  - type: WellKnown
    url: well-known/deep-instinct-well-known.yml
