aid: deep-instinct
name: Deep Instinct
description: >-
  Deep Instinct is a preemptive data security company that applies a purpose-built deep learning framework
  (the DSX Brain) to prevent and explain unknown malware, ransomware and zero-day threats in real time,
  without signatures, heuristics, cloud lookups or external threat feeds. Its DSX platform protects data
  across cloud storage, network-attached storage (Dell CAVA, NetApp Vscan), applications and endpoints,
  and pairs the prevention engine with DSX Companion (DIANNA), a GenAI analysis assistant that produces
  human-readable explanations of novel attacks for SOC triage. The DSX management console (D-Appliance)
  exposes a versioned REST API at /api/v1 for device, group, policy, event, hash allow/block-list, remote
  remediation and audit-log automation, and Deep Instinct's customer portal now also fronts an
  OAuth-protected MCP server for agent access to portal content.
